AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UNAM Student Agent — serverless AI academic assistant

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 120
    PermissionsBoundary: arn:aws:iam::210373500643:policy/hackathon-boundary
    Environment:
      Variables:
        STUDENTS_TABLE: !Ref StudentsTable
        COURSES_TABLE: !Ref CoursesTable
        PROFESSORS_TABLE: !Ref ProfessorsTable
        ROADMAPS_TABLE: !Ref RoadmapsTable
        SESSIONS_TABLE: !Ref SessionsTable
        RAG_BUCKET: !Ref RagCorpusBucket
        REGION: !Ref AWS::Region

Resources:

  # ── DynamoDB Tables ────────────────────────────────────────────────────────

  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-students
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: careerGoal, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: careerGoal-PK-index
          KeySchema:
            - { AttributeName: careerGoal, KeyType: HASH }
            - { AttributeName: PK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  CoursesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-courses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: professorId, AttributeType: S }
        - { AttributeName: semester, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: professor-courses-index
          KeySchema:
            - { AttributeName: professorId, KeyType: HASH }
            - { AttributeName: SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: semester-index
          KeySchema:
            - { AttributeName: semester, KeyType: HASH }
            - { AttributeName: PK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ProfessorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-professors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RoadmapsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-roadmaps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 Bucket ──────────────────────────────────────────────────────────────

  RagCorpusBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub unam-rag-corpus-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-reviews-cache
            Status: Enabled
            Prefix: reviews-cache/
            ExpirationInDays: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ── SQS Queues ─────────────────────────────────────────────────────────────

  ScrapingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: unam-scraping-queue
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScrapingDLQ.Arn
        maxReceiveCount: 3

  ScrapingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: unam-scraping-dlq
      MessageRetentionPeriod: 604800

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: unam-notification-queue
      VisibilityTimeout: 60

  # ── SNS Topic ──────────────────────────────────────────────────────────────

  StudentNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: unam-student-notifications
      Subscription:
        - Protocol: sqs
          Endpoint: !GetAtt NotificationQueue.Arn

  # ── Lambda Functions ───────────────────────────────────────────────────────

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: unam-agent-orchestrator
      Handler: index.handler
      CodeUri: ../backend/src/orchestrator/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref StudentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CoursesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProfessorsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RoadmapsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3ReadPolicy: { BucketName: !Ref RagCorpusBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: unam-scraper
      Handler: index.handler
      CodeUri: ../backend/src/scraper/
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CoursesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProfessorsTable }
        - S3CrudPolicy: { BucketName: !Ref RagCorpusBucket }
        - SQSPollerPolicy: { QueueName: !GetAtt ScrapingQueue.QueueName }
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScrapingQueue.Arn
            BatchSize: 5

  RefreshSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: unam-schedule-refresh
      Handler: index.handler
      CodeUri: ../backend/src/refresh/
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt ScrapingQueue.QueueName }
      Events:
        NightlyRefresh:
          Type: Schedule
          Properties:
            Schedule: cron(0 5 * * ? *)
            Description: Nightly refresh of UNAM course schedule data

  # ── API Gateway ────────────────────────────────────────────────────────────

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: unam-student-agent-api

  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: chat

  ChatMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${OrchestratorFunction.Arn}/response-streaming-invocations

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ChatMethod]
    Properties:
      RestApiId: !Ref Api

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OrchestratorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # ── CloudWatch Alarms ──────────────────────────────────────────────────────

  ScrapingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: unam-scraping-dlq-not-empty
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScrapingDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  StudentsTable:
    Value: !Ref StudentsTable
  CoursesTable:
    Value: !Ref CoursesTable
  RagBucket:
    Value: !Ref RagCorpusBucket
  ScrapingQueue:
    Value: !Ref ScrapingQueue
  NotificationsTopic:
    Value: !Ref StudentNotificationsTopic
