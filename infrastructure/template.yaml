AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UNAM Student Agent — AI academic assistant for Facultad de Ciencias CC students

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 120
    Environment:
      Variables:
        STUDENTS_TABLE:   !Ref StudentsTable
        COURSES_TABLE:    !Ref CoursesTable
        PREREQS_TABLE:    !Ref PrerequisitesTable
        PROFESSORS_TABLE: !Ref ProfessorsTable
        ROADMAPS_TABLE:   !Ref RoadmapsTable
        REVIEWS_TABLE:    !Ref ProfessorReviewsTable
        PROGRESS_TABLE:   !Ref StudentProgressTable
        AGENDA_TABLE:     !Ref AgendaTable
        RAG_TABLE:        !Ref RagChunksTable
        SESSIONS_TABLE:   !Ref SessionsTable
        DOCS_BUCKET:      !Sub unam-rag-corpus-${AWS::AccountId}

Resources:

  # ── Lambda — Main Agent Orchestrator ─────────────────────────────────────────

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: unam-agent-orchestrator
      Handler: index.handler
      CodeUri: ../backend/src/orchestrator/
      Role: arn:aws:iam::705315017190:role/nube-agent-execution-role
      Events:
        GetChat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /
            Method: GET
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chat
            Method: POST

  # ── API Gateway ───────────────────────────────────────────────────────────────

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: unam-student-agent-api

  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: chat

  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !GetAtt Api.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${OrchestratorFunction.Arn}/response-streaming-invocations

  ChatMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${OrchestratorFunction.Arn}/response-streaming-invocations

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RootMethod, ChatMethod]
    Properties:
      RestApiId: !Ref Api

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OrchestratorFunction.Arn
      Action: lambda:InvokeWithResponseStream
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # ── DynamoDB Tables ───────────────────────────────────────────────────────────

  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-students
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  CoursesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-courses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  PrerequisitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-prerequisites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: clave, AttributeType: S }
        - { AttributeName: prereqClave, AttributeType: S }
      KeySchema:
        - { AttributeName: clave, KeyType: HASH }
        - { AttributeName: prereqClave, KeyType: RANGE }

  ProfessorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-professors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ProfessorReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-professor-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: professorId, AttributeType: S }
        - { AttributeName: sourceId, AttributeType: S }
      KeySchema:
        - { AttributeName: professorId, KeyType: HASH }
        - { AttributeName: sourceId, KeyType: RANGE }

  RoadmapsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-roadmaps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  StudentProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-student-progress
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: studentId, AttributeType: S }
        - { AttributeName: clave, AttributeType: S }
      KeySchema:
        - { AttributeName: studentId, KeyType: HASH }
        - { AttributeName: clave, KeyType: RANGE }

  AgendaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-agenda
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: studentId, AttributeType: S }
        - { AttributeName: deadlineTypeId, AttributeType: S }
      KeySchema:
        - { AttributeName: studentId, KeyType: HASH }
        - { AttributeName: deadlineTypeId, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  RagChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-rag-chunks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: chunkId, AttributeType: S }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: chunkId, KeyType: RANGE }

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unam-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ChatUrl:
    Description: Open this URL to chat with your UNAM Student Agent
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  StudentsTable:
    Value: !Ref StudentsTable
  CoursesTable:
    Value: !Ref CoursesTable
  SessionsTable:
    Value: !Ref SessionsTable
